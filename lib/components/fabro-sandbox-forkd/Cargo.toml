[package]
name = "fabro-sandbox-forkd"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "JSON-RPC 2.0 over stdio sandbox-provider plugin for forkd — a reference implementation of the upstream fabro-sh provider-plugin sketch (PR #567)"

[lib]
name = "fabro_sandbox_forkd"
doctest = false

[[bin]]
name = "fabro-sandbox-forkd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
async-trait.workspace = true
strum.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }

[dev-dependencies]
httpmock = "0.8"
tokio = { workspace = true, features = ["test-util", "macros", "io-util"] }
